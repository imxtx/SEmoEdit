[project]
name = "semoedit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML", "soundfile", "torch"]

[project.optional-dependencies]
bridging = ["funasr>=1.4.3", "modelscope>=1.39.1", "transformers<5", "torchaudio"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semoedit*"]
